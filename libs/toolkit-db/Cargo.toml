[package]
name = "cf-gears-toolkit-db"
version = "0.14.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ToolKit database library"
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-toolkit"]
categories = ["development-tools"]
metadata.docs.rs.all-features = true

[lib]
name = "toolkit_db"

[lints]
workspace = true

[features]
default = []

# Internal helper, enabled automatically by any concrete backend. Used as a
# virtual OR in targets that need some backend but don't care which (e.g. the
# outbox benchmarks). Not intended to be enabled directly.
_any-backend = []

# DB driver selection -- the single entry point for backend choice.
# sea-orm and sea-orm-migration remain non-optional: toolkit-db unconditionally
# re-exports sea_orm_migration and uses sea_orm::{DatabaseConnection, DbErr, …}
# in non-cfg-gated code.  sqlx is optional because every source-level use is
# already behind #[cfg(feature = "pg"|"mysql"|"sqlite")].
sqlite = [
    "_any-backend",
    "dep:sqlx",
    "sqlx/sqlite",
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
]
pg = [
    "_any-backend",
    "dep:sqlx",
    "sqlx/postgres",
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
]
mysql = [
    "_any-backend",
    "dep:sqlx",
    "sqlx/mysql",
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
]

integration = []

# Test-only surface for external integration-test suites that need to observe
# transaction boundaries or attach a SeaORM query-metric callback (e.g. the
# resource-group DB-behavior audit's `QueryRecorder`). Not used by production
# code paths; see `connect_db_with_metric_callback` and
# `secure::in_transaction_for_testing`.
test-support = ["dep:regex"]

[dependencies]
# Only used by the `test-support` module's SQL normalizer; optional so a
# production build never pulls it in.
regex = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-retry = { workspace = true }
xxhash-rust = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
time = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-db-macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
toolkit-security = { workspace = true }
toolkit-odata = { workspace = true }
toolkit-utils = { workspace = true, features = ["humantime-serde"] }
bigdecimal = { workspace = true }
rust_decimal = { workspace = true }
ryu = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
figment = { workspace = true }
sqlx = { workspace = true, optional = true }
# Unconditional: the transactional outbox pipeline is always compiled in.
tokio-util = { workspace = true }
futures-util = { workspace = true }

[[example]]
name = "outbox_transactional"
required-features = ["sqlite"]

[[example]]
name = "outbox_retry_reject"
required-features = ["sqlite"]

[[example]]
name = "outbox_dead_letters"
required-features = ["sqlite"]

[[example]]
name = "outbox_batch_multi_queue"
required-features = ["sqlite"]

[[example]]
name = "outbox_custom_prefix"
required-features = ["sqlite"]

[[bench]]
name = "outbox_throughput"
harness = false
# `_any-backend` is a virtual OR over pg/mysql/sqlite (see [features] above).
# The bench body compile-errors out if no backend is present.
required-features = ["_any-backend"]

[[bench]]
name = "worker_overhead"
harness = false
required-features = ["_any-backend"]

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = { workspace = true }
toolkit-utils = { workspace = true, features = ["serde"] }
serde-saphyr = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
anyhow = { workspace = true }
temp-env = { workspace = true }
trybuild = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

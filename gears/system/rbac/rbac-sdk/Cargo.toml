[package]
name = "cf-gears-rbac-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RBAC Service SDK: infrastructure-free contract for ClientHub consumers"
repository.workspace = true
keywords = ["constructorfabric", "cf-gears", "rbac"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "rbac_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# `chrono` needs the `serde` feature so `DateTime<Utc>` round-trips on entity timestamps.
chrono = { workspace = true, features = ["serde"] }
# `SecurityContext` is a thin DTO published as the caller-identity type on the
# trait; the SDK stays "infrastructure-free" — no transport, no DB, no runtime.
toolkit-security = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
serde_json = { workspace = true }

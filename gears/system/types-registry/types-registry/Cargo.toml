[package]
name = "cf-gears-types-registry"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Types Registry gear: GTS entity registration, storage, and REST API"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["development-tools"]
metadata.docs.rs.all-features = true

[lints]
workspace = true

[lib]
name = "types_registry"
doctest = false

[dependencies]
# SDK - public API, models, and errors
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.7", path = "../types-registry-sdk" }

# GTS types (from git dependency)
gts = { workspace = true }

# Core dependencies
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["time"] }
axum = { workspace = true, features = ["macros"] }
uuid = { workspace = true, features = ["v5"] }
thiserror = { workspace = true }
# SHA-256 for request/idempotency fingerprints and the persisted resolution
# identity. The FIPS-validated implementation the platform installs at bootstrap,
# rather than the `sha2` crate DE0708 bans -- see `domain/admission/fingerprint.rs`.
aws-lc-rs = { workspace = true }
parking_lot = { workspace = true }
lru = "0.18.2"

# Persistence (SPEC §5) - driver features come from toolkit-db
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
# `Scopable` / `#[secure(...)]` on the storage entities.
toolkit-db-macros = { workspace = true }
# `timestamptz` columns; `macros` is dev-only, for `datetime!` literals in tests.
time = { workspace = true }

# Local dependencies
# `toolkit_db::outbox` needs no feature: it stopped being a preview in
# toolkit-db 0.12.0 and is now unconditional.
toolkit = { workspace = true }
# Quickstart and the default unit/integration path bind this gear to SQLite at
# runtime; dev-dependency feature unification must not be what enables it.
toolkit-db = { workspace = true, features = ["sqlite"] }
toolkit-canonical-errors = { workspace = true, features = ["axum"] }
toolkit-gts = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-utils = { workspace = true }

[features]
# Gates the container-backed PostgreSQL / MySQL migration tests
# (`tests/migration_backends_test.rs`). Off by default because they need a
# Docker daemon; enable with `--features integration`. The SQLite half of the
# suite always runs.
integration = ["toolkit-db/pg", "toolkit-db/mysql"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# In-memory SQLite for the schema-level migration tests.
toolkit-db = { workspace = true, features = ["sqlite"] }
# PostgreSQL / MySQL bring-up for the `integration` suite. Not optional --
# `[dev-dependencies]` cannot be -- but every reference is behind
# `#![cfg(feature = "integration")]`, so a default `cargo test` needs no Docker.
# The images come from `test-containers`, never from
# `testcontainers-modules`' own defaults, whose tags are long past end of life
# and would pin the database version transitively through `Cargo.lock`
# (`cargo xtask check-test-container-pins`).
testcontainers = { workspace = true }
test-containers = { workspace = true }
# `Router::oneshot` for the REST contract tests (T9).
tower = { workspace = true }
time = { workspace = true, features = ["macros"] }

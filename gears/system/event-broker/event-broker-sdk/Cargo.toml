[package]
name = "cf-gears-event-broker-sdk"
description = "SDK for the Event Broker: high-level typed event publishing and consumption"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "event-broker"]
categories = ["asynchronous"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "event_broker_sdk"
path = "src/lib.rs"

[features]
default = []
db = ["dep:sea-orm", "dep:toolkit-db", "toolkit-db/sqlite"]
# Gates this SDK's own transactional-outbox producer surface (see src/producer/).
# `toolkit-db`'s outbox pipeline is unconditional, so `db` is all this needs.
outbox = ["db"]
integration = []
test-util = ["dep:async-stream"]
# REST transport implementation of `EventBrokerApi` (src/rest/) and the
# `cf-evctl` binary. Off by default so a plain SDK build pulls in no HTTP or
# wire dependencies (base-trait purity, docs/arch/toolkit-contract-binding).
rest-client = [
    "dep:reqwest",
    "dep:toolkit-http",
    "dep:bytes",
    "dep:serde_html_form",
    "dep:async-stream",
    "dep:clap",
    "dep:secrecy",
    "dep:http-body-util",
    "dep:http-body",
]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7", "serde"] }
chrono = { workspace = true, features = ["clock", "serde"] }
tracing = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
async-stream = { workspace = true, optional = true }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-stable-hash = { workspace = true }
jsonschema = { workspace = true }

gts-id = { workspace = true }
gts = { workspace = true }
toolkit-gts = { workspace = true }
# `Iso8601Duration` for the retention trait and its DTO: a validated duration
# rather than a string, carrying its ISO 8601 wire form through serde and
# emitting `format: "duration"` in the generated schema.
toolkit-utils = { workspace = true, features = ["serde", "schemars"] }
# JSON-Schema reflection backend behind `#[gts_type_schema]`: the base type
# schemas in `src/gts.rs` are emitted from their Rust declarations, so the
# per-field keywords (`pattern`, `readOnly`, ...) come from schemars attributes.
schemars = { workspace = true }
toolkit-db = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }

# --- REST transport (feature = "rest-client") -------------------------------
reqwest = { workspace = true, optional = true }
toolkit-http = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
serde_html_form = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }

[[bin]]
name = "cf-evctl"
path = "src/bin/evctl.rs"
required-features = ["rest-client"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
trybuild = { workspace = true }

[package]
name = "cf-gears-static-license-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "License resolver plugin with static config-driven grant rules for development and testing"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "licensing"]
categories = ["authentication"]
metadata.docs.rs.all-features = true

[lib]
name = "static_license_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
license-resolver-sdk = { workspace = true }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }

# GTS types
gts = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-util = { workspace = true }
toolkit-gts = { workspace = true }

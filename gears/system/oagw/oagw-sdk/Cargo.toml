[package]
name = "cf-gears-oagw-sdk"
description = "SDK for the OpenAPI Gateway: API traits, models, and error definitions"
version = "0.5.11"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "oagw_sdk"
path = "src/lib.rs"

[features]
default = []
axum = ["dep:axum"]

[dependencies]
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-security = { workspace = true }
axum = { workspace = true, features = ["ws"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
async-openai = { version = "0.41", default-features = false, features = ["chat-completion"] }
octocrab = { version = "0.49", default-features = false, features = ["jwt-aws-lc-rs"] }
tower = { workspace = true, features = ["util"] }
http-body = { workspace = true }
http-body-util = { workspace = true }

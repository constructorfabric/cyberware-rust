components:
  schemas:
    CredentialDto:
      description: 'Response body for `GET /credstore/v1/credentials/{ref}` (ADR-0004): the

        credential record. Never carries the value — see [`SecretDto`].'
      properties:
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        fallback:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FallbackDto'
            description: 'The caller''s own row''s suppression policy; absent when the caller

              holds no row under the reference (`status: none`).'
        inheritance:
          $ref: '#/components/schemas/InheritanceStatusDto'
        owner_id:
          description: 'Subject id that created the caller''s own row; absent iff `status` is

            `none`. Never populated from an ancestor''s row — an inherited entry

            must not disclose identifiers from another tenant, and a caller who

            needs the ancestor''s owner acts in that tenant''s context and reads

            it there.'
          type:
          - string
          - 'null'
        reference:
          type: string
        sharing:
          $ref: '#/components/schemas/SharingModeDto'
        status:
          $ref: '#/components/schemas/CredentialStatusDto'
        type:
          type: string
        updated_at:
          description: 'The caller''s own row''s last-write instant; absent iff `status` is

            `none`.'
          format: date-time
          type:
          - string
          - 'null'
        version:
          description: The caller's own row's version; absent iff `status` is `none`.
          format: int64
          type:
          - integer
          - 'null'
      required:
      - reference
      - type
      - sharing
      - status
      - inheritance
      type: object
    CredentialListItemDto:
      description: 'One item of `GET /credstore/v1/credentials` (ADR-0005/ADR-0004): the same

        fields as [`CredentialDto`], plus `secret` — populated only in value mode

        (`$select` containing `secret`) and only for an item the caller may read;

        absent from the wire entirely in metadata mode or when the item''s value

        could not be served (refused, missing, fingerprint mismatch — omitted by

        the domain layer already, never reported as an error for one item).


        `Debug` is hand-written to redact `secret`.'
      properties:
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        fallback:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FallbackDto'
        inheritance:
          $ref: '#/components/schemas/InheritanceStatusDto'
        owner_id:
          type:
          - string
          - 'null'
        reference:
          type: string
        secret:
          description: 'The decrypted value — the same wire form as [`SecretDto::value`] —

            present only in value mode, for an item the caller may read.'
          type:
          - string
          - 'null'
        sharing:
          $ref: '#/components/schemas/SharingModeDto'
        status:
          $ref: '#/components/schemas/CredentialStatusDto'
        type:
          type: string
        updated_at:
          format: date-time
          type:
          - string
          - 'null'
        version:
          format: int64
          type:
          - integer
          - 'null'
      required:
      - reference
      - type
      - sharing
      - status
      - inheritance
      type: object
    CredentialPatchDto:
      additionalProperties: false
      description: 'Request body for `PATCH /credstore/v1/credentials/{ref}` (ADR-0004): an

        RFC 7396 JSON Merge Patch. Every field is tri-state (`Option<Option<T>>`):

        absent (untouched), explicit `null`, or a value. `secret_type`/`sharing`/

        `fallback` have no valid `null` state on the wire (rejected as

        `NULL_NOT_ALLOWED` by the handler, since none is a nullable column);

        `expires_at`/`value` do — `null` clears/removes them.


        `Debug` is hand-written to redact `value`.'
      properties:
        expires_at:
          type:
          - string
          - 'null'
        fallback:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FallbackDto'
        sharing:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SharingModeDto'
        type:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      type: object
    CredentialStatusDto:
      description: 'The caller''s own-row status for the REST transport layer (ADR-0004, "Two

        representations").'
      enum:
      - none
      - declared
      - active
      type: string
    FallbackDto:
      description: Suppression policy for the REST transport layer (ADR-0004, "Suppression").
      enum:
      - inherit
      - none
      type: string
    InheritanceStatusDto:
      description: 'The effective-row inheritance status for the REST transport layer

        (ADR-0004, "Two representations").'
      enum:
      - own
      - inherited
      - overridden
      - suppressed
      type: string
    PageInfo:
      properties:
        limit:
          format: int64
          minimum: 0
          type: integer
        next_cursor:

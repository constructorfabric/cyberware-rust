          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page_info
      type: object
    Problem:
      description: RFC 9457 problem+json. `context` varies by error category.
      properties:
        context:
          type: object
        detail:
          type: string
        instance:
          type: string
        status:
          format: int32
          type: integer
        title:
          type: string
        trace_id:
          type: string
        type:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - context
      type: object
    PutCredentialRequestDto:
      additionalProperties: false
      description: 'Request body for `PUT /credstore/v1/credentials/{ref}` (ADR-0004): a

        whole-credential replace. `value` is modelled as optional at the wire

        shape (`Option<String>`) so its *absence* can be distinguished from a

        malformed body and rejected with the typed `VALUE_REQUIRED` reason rather

        than a generic deserialization error.


        `Debug` is hand-written to redact `value`.'
      properties:
        expires_at:
          description: 'Expiry instant (RFC 3339); only for expirable types. A `PUT` is a

            whole-value replace: omitting `expires_at` clears a stored expiry.'
          format: date-time
          type:
          - string
          - 'null'
        fallback:
          $ref: '#/components/schemas/FallbackDto'
          description: Suppression policy; defaults to `inherit`.
        sharing:
          $ref: '#/components/schemas/SharingModeDto'
          description: Sharing mode — required (ADR-0004).
        type:
          description: 'Full GTS type id. Required on create; on replace it must equal the

            stored type (`TYPE_IMMUTABLE` otherwise).'
          type:
          - string
          - 'null'
        value:
          description: The value to write. Required — its absence is `400 VALUE_REQUIRED`.
          type:
          - string
          - 'null'
      required:
      - sharing
      type: object
    SecretDto:
      description: 'Response body for `GET /credstore/v1/credentials/{ref}/secret`

        (ADR-0004): the value with exactly what is needed to use it.


        `Debug` is hand-written to redact `value`.'
      properties:
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        reference:
          type: string
        type:
          type: string
        value:
          type: string
      required:
      - reference
      - type
      - value
      type: object
    SharingModeDto:
      description: Sharing mode for the REST transport layer.
      enum:
      - private
      - tenant
      - shared
      type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http

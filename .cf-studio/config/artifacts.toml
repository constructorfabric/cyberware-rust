patterns = ["gears/bss/contracts/*"]

[[ignore]]
reason = "BSS multi-slice design sets (gears/bss/*/docs/design/*.md — pricing 12, rating 16, subscriptions 9 slices): DELIBERATELY outside cfs autodetect/traceability. cfs hardcodes the artifact-kind set, so a DESIGN_SLICE kind cannot be registered via the kit manifest (attempted + reverted 2026-07-28); a brace-glob on the DESIGN pattern breaks DESIGN.md matching. The slice docs follow the DESIGN template, declare cpt-cf-bss-* ids, and are review-audited (2026-07-22/28 waves) instead of cfs-validated. Revisit when cfs supports custom kinds — tracked in pricing DECISIONS.md (2026-07-28 review, finding 15)."
patterns = ["gears/bss/*/docs/design/*"]

[[systems]]
name = "cf-gears"
slug = "cf"
kit = "gears"

[[systems.autodetect]]
kit = "gears"
system_root = "{project_root}/gears/$system"
artifacts_root = "{system_root}/docs"

[systems.autodetect.artifacts]
[systems.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

# Glob (not a literal name) so a gear may ship companion design documents
# alongside DESIGN.md — DESIGN-<aspect>.md, for an aspect large enough to
# carve out of the main design and own its own artifact. Each match is
# validated as a full DESIGN artifact against the kit constraints.
# Files that are NOT standalone SDLC artifacts must be listed in [[ignore]]
# above; ignore takes precedence over this pattern.
[systems.autodetect.artifacts.DESIGN]
pattern = "DESIGN*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.ADR]
pattern = "ADR/*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.DECOMPOSITION]
pattern = "DECOMPOSITION.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.FEATURE]
pattern = "features/*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.UPSTREAM_REQS]
pattern = "UPSTREAM_REQS.md"
traceability = "DOCS-ONLY"
required = false

[systems.autodetect.validation]
require_kind_registered_in_kit = true
require_md_extension = true
fail_on_unmatched_markdown = true

[[systems.autodetect.codebase]]
name = "Gears"
path = "{system_root}/src"
extensions = [".rs"]

[[systems.autodetect.codebase]]
name = "Tests"
path = "{system_root}/tests"
extensions = [".rs"]

# Some gears/$system modules (e.g. file-storage) nest the crate a level deeper
# (gears/file-storage/file-storage/src, plus a sibling *-sdk crate) instead of
# putting the crate directly at gears/$system/src — mirrors the equivalent
# "Nested Gears"/"Nested Tests"/"Nested SDK"/"Nested SDK Tests" entries already
# used below for gears/system/$system. Without these, code under a nested
# crate layout is never scanned for @cpt traceability markers, so any to_code
# CDSL instruction there can never be satisfied regardless of the markers
# actually present in the code.
[[systems.autodetect.codebase]]
name = "Nested Gears"
path = "{system_root}/{system}/src"
extensions = [".rs"]

[[systems.autodetect.codebase]]
name = "Nested Tests"
path = "{system_root}/{system}/tests"
extensions = [".rs"]

[[systems.autodetect.codebase]]
name = "Nested SDK"
path = "{system_root}/{system}-sdk/src"
extensions = [".rs"]

[[systems.autodetect.codebase]]
name = "Nested SDK Tests"
path = "{system_root}/{system}-sdk/tests"
extensions = [".rs"]

[[systems.autodetect]]
kit = "gears"
system_root = "{project_root}/gears/system/$system"
artifacts_root = "{system_root}/docs"

[systems.autodetect.artifacts]
[systems.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

[systems.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.ADR]
pattern = "ADR/*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.DECOMPOSITION]
pattern = "DECOMPOSITION.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.FEATURE]
pattern = "features/*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.UPSTREAM_REQS]
pattern = "UPSTREAM_REQS.md"
traceability = "DOCS-ONLY"
required = false

[systems.autodetect.validation]
require_kind_registered_in_kit = true
require_md_extension = true
# fail_on_unmatched_markdown is disabled at this scope because children autodetect rules
# (e.g. account-management/docs/tr-plugin) do not carve their paths out of the parent's
# unmatched-markdown walk, so tightening this would flag legitimate sub-plugin artifacts
# as unmatched.
#
# Known trade-off: because this autodetect block matches every gears/system/$system
# (oagw, resource-group, account-management, and any future sibling), setting this flag
# to `false` here also disables unmatched-markdown detection across every other
# gears/system/* subtree — not only account-management. Strictness is retained on each
# child scope (see the tr-plugin child below, which keeps fail_on_unmatched_markdown = true).
#
# Do NOT tighten this flag without first introducing a per-path carve-out mechanism for
# the tr-plugin-style sub-plugin case; otherwise the legitimate sub-plugin artifacts will
# re-surface as unmatched-markdown failures for every module that ships nested artifacts.
fail_on_unmatched_markdown = false


[[ignore]]
reason = "Ignore usage-collector DESIGN, DECOMPOSITION, features and ADRs — they still describe the superseded model (counter/gauge usage kinds, event deactivation, signed compensation) and reference concepts the PRD no longer defines, pending the rewrite to aggregation folds and invalidation tracked in PRD section 13. PRD.md still validated via autodetect."
patterns = [
  "gears/system/usage-collector/docs/DESIGN.md",
  "gears/system/usage-collector/docs/DECOMPOSITION.md",
  "gears/system/usage-collector/docs/features/*",
  "gears/system/usage-collector/docs/ADR/*",
  "gears/system/usage-collector/usage-collector/src/*",
  "gears/system/usage-collector/usage-collector/tests/*",
  "gears/system/usage-collector/usage-collector-sdk/src/*",
]

[[ignore]]
reason = "Ignore the TimescaleDB usage-collector storage plugin — its specs and code still describe the superseded model and reference usage-collector concepts the PRD no longer defines (fr-usage-compensation, fr-event-deactivation, fr-usage-type-registration, fr-usage-type-deletion, fr-usage-type-existence-and-semantics), pending the plugin's own update to aggregation folds and invalidation once the rewrite tracked in PRD section 13 lands. Docs and code are ignored together: ignoring the specs alone would orphan the plugin's code traceability markers."
patterns = [
  "gears/system/usage-collector/plugins/timescaledb-usage-collector-plugin/docs/*",
  "gears/system/usage-collector/plugins/timescaledb-usage-collector-plugin/src/*",
  "gears/system/usage-collector/plugins/timescaledb-usage-collector-plugin/tests/*",
]


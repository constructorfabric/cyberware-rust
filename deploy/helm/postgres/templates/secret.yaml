apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Bootstrap superuser (owns every per-gear database created below).
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  # Maintenance database only; per-gear databases are created by the init script.
  POSTGRES_DB: {{ .Values.auth.maintenanceDb | quote }}

cf-gears-cluster-conformance = { version = "0.3.2", path = "gears/system/cluster/cluster-conformance" }

# System gears SDKs
account-management-sdk = { package = "cf-gears-account-management-sdk", version = "0.6.2", path = "gears/system/account-management/account-management-sdk" }
keycloak-idp-plugin = { package = "cf-gears-keycloak-idp-plugin", version = "0.1.1", path = "gears/system/account-management/plugins/keycloak-idp-plugin" }
cluster-sdk = { package = "cf-gears-cluster-sdk", version = "0.2.2", path = "gears/system/cluster/cluster-sdk" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.6", path = "gears/system/types-registry/types-registry-sdk" }
tenant-resolver-sdk = { package = "cf-gears-tenant-resolver-sdk", version = "0.3.23", path = "gears/system/tenant-resolver/tenant-resolver-sdk" }
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.3.23", path = "gears/system/authz-resolver/authz-resolver-sdk" }
resource-group-sdk = { package = "cf-gears-resource-group-sdk", version = "0.3.0", path = "gears/system/resource-group/resource-group-sdk" }
oagw-sdk = { package = "cf-gears-oagw-sdk", version = "0.5.10", path = "gears/system/oagw/oagw-sdk" }
usage-collector-sdk = { package = "cf-gears-usage-collector-sdk", version = "0.3.8", path = "gears/system/usage-collector/usage-collector-sdk" }
quota-enforcement-sdk = { package = "cf-gears-quota-enforcement-sdk", version = "0.1.0", path = "gears/system/quota-enforcement/quota-enforcement-sdk" }

# BSS gears (ported from vhp-core)
bss-ledger-sdk = { package = "cf-gears-bss-ledger-sdk", version = "0.1.3", path = "gears/bss/ledger/ledger-sdk" }
# No `version` here, unlike the ledger and rate-provider SDKs around it, because
# `cf-gears-bss-pricing-sdk/Cargo.toml` declares none either — the crate is not a release
# target yet. `tools/scripts/check_packaging_metadata.py` agrees rather than
# merely tolerating it: its second pass skips any package with no `[package]
# version` ("not a release target yet (WIP), so `cargo publish` never runs on
# it"), and `cf-gears-bss-pricing` is such a package, so its `workspace = true` dependency
# on this entry is never examined. Asserting a version here that the crate does
# not declare would be a claim about a release that has not been planned. The day
# `cf-gears-bss-pricing` takes a `version`, this entry and `pricing-sdk`'s own `[package]`
# must gain one in the same change or that gate turns red — which is the intended
# coupling, not a latent trap.
bss-pricing-sdk = { package = "cf-gears-bss-pricing-sdk", path = "gears/bss/pricing/pricing-sdk" }
bss-rate-provider-sdk = { package = "cf-gears-bss-rate-provider-sdk", version = "0.1.4", path = "gears/bss/rate-provider/rate-provider-sdk" }
coord = { package = "cf-gears-bss-coord", path = "gears/bss/libs/coord" }
# The joint golden conformance fixture corpus. `bss-fixtures` carries no charge
# arithmetic and is the only one a gear may depend on in production; the
# conformance harness is a dev-dependency only.
#
# `default-features = false` here so a **gear** can inherit the narrow
# production surface (`ModelKind` + `Registry` + `gate_open_for`): Cargo refuses
# `default-features = false` on an inherited dependency unless the workspace
# entry states it, so the default is set narrow and the corpus half is opted
# into by name where it is actually wanted.
bss-fixtures = { package = "cf-gears-bss-fixtures", path = "gears/bss/fixtures/bss-fixtures", default-features = false }
bss-fixtures-conformance = { package = "cf-gears-bss-fixtures-conformance", path = "gears/bss/fixtures/bss-fixtures-conformance" }
# FIPS-validated SHA-256 for the ledger idempotency payload fingerprint.
aws-lc-rs = "1.17"

# credstore
credstore-sdk = { package = "cf-gears-credstore-sdk", version = "0.2.11", path = "gears/credstore/credstore-sdk" }

# mini-chat
mini-chat-sdk = { package = "cf-gears-mini-chat-sdk", version = "0.10.20", path = "gears/mini-chat/mini-chat-sdk" }

# api-contracts (example: toolkit-contract macros showcased on a Payment API)
api-contracts-sdk = { package = "cf-api-contracts-sdk", version = "0.1.0", path = "examples/toolkit/api-contracts/api-contracts-sdk" }

# System gears
grpc_hub = { package = "cf-gears-grpc-hub", version = "0.2.20", path = "gears/system/grpc-hub" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `toolkit-contract-protogen`'s, and it stays at the major upstream chose for it.
#
# **This is an add/add and not a disagreement**: `toml` was in neither side's
# workspace table at the merge base. Upstream added `0.8` for the protogen tool
# and this branch added `1` for the golden-fixture corpus
# (`gears/bss/fixtures/corpus`), which is hand-authored and hand-reviewed as
# normative text and was written against the 1.x API. Neither crate can be moved
# onto the other's major by this rebase without a code change nobody has reviewed,
# so `bss-fixtures` and `bss-fixtures-conformance` name `toml = "1"` directly
# instead of inheriting. The lockfile already carries both — 0.8.23 and 1.1.2 —
# so the duplication is upstream's own resolution and not something this adds.
toml = "0.8"
serde-saphyr = "0.0.22"
humantime-serde = "1.1"
secrecy = { version = "0.10", features = ["serde"] }
serde_urlencoded = "0.7"
# Query-string codec shared by the generated REST client and its server
# extractor. Unlike `serde_urlencoded` it round-trips repeated keys into a
# sequence, which is what makes `Vec<T>` query fields work end to end.
serde_html_form = "0.4"
schemars = { version = "1.2", features = ["derive", "uuid1"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
# Default features include the `rand`-backed `strategy::jitter` helper used by
# the gRPC retry schedules.
tokio-retry = "0.3"
futures = "0.3"
async-trait = "0.1"
async-stream = { version = "0.3" }

# High-performance data structures
dashmap = "6.1"
arc-swap = "1.7"

# Security
zeroize = { version = "1", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "time",
    "local-time",
] }
tracing-log = "0.2"
tracing-opentelemetry = "0.33"
tracing-appender = "0.2"
tracing-test = "0.2"
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = [
    "grpc-tonic",
    "http-proto",
] }

# Web framework (only for api-gateway)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "cors",
    "limit",
    "util",
    "timeout",
    "decompression-gzip",
    "decompression-br",
    "decompression-deflate",
    "follow-redirect",
    "catch-panic",
] }
uuid = { version = "1.23.3", features = ["serde", "v5"] }
governor = "0.10"

# OpenAPI documentation (only for api-gateway)
utoipa = { version = "5.5", features = [
    "macros",
    "openapi_extensions",
    "chrono",
    "uuid",
] }

# HTTP stack dependencies
hyper = "1.10.1"
hyper-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "aws-lc-rs",
    "http1",
    "http2",
    "tls12",
    "native-tokio",
    "webpki-tokio",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
http-body-util = "0.1"
http-body = "1"

# HTTP client (default-tls = rustls + aws-lc-rs in 0.13)
reqwest = { version = "0.13", features = ["stream"] }
rand = "0.10"

# S3 client (file-storage gear only, cpt-cf-file-storage-adr-s3-client-selection) —
# sign-only request builder; requests are executed via the existing reqwest client.
rusty-s3 = { version = "0.10", default-features = false }
# XML response/error parsing for the S3 backend (ADR-0005). Pinned >= 0.41.0: RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 (DoS) are fixed only as of this release.
quick-xml = "0.41"

# Synchronous locks for better performance
parking_lot = "0.12"

# Property / model-based testing (cluster conformance suite reference model)
proptest = "1"

# CLI support
clap = { version = "4.5", features = ["derive"] }

# Database utilities
#
# TLS note: sea-orm and sea-orm-migration use runtime-tokio (NOT runtime-tokio-rustls).
# runtime-tokio-rustls would transitively activate sqlx/tls-rustls-ring, enabling
# the `ring` crypto provider on rustls IN ADDITION to our aws-lc-rs.  With both
# providers active, rustls 0.23 can no longer auto-detect and panics at runtime
# in any code that calls ServerConfig::builder() without a prior
# CryptoProvider::install_default() (e.g. tests).
# TLS is provided separately via sqlx/tls-rustls-aws-lc-rs below.
#
# Since sqlx 0.9 the combined runtime+TLS features (runtime-tokio-rustls, ...) are
# gone upstream, so the split below is the only form available -- which is exactly
# what we already wanted.
#
# `sqlite-use-returning-for-3_35` is part of sea-orm 2.0's default feature set; we
# set default-features = false, so it has to be listed explicitly.
# NOT enabled on purpose:
#   - `stream`: nothing in the workspace uses ConnectionTrait::stream/StreamTrait.
#   - `postgres-use-serial-pk`: we never generate DDL from entities (no Schema::new /
#     create_table_from_entity), so 2.0's serial -> GENERATED BY DEFAULT AS IDENTITY
#     change cannot affect our schemas; all serial/identity columns are hand-written SQL.
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio",
    "with-uuid",
    "with-chrono",
    "with-time",
    "with-json",
    "with-rust_decimal",
    "macros",
    "sqlite-use-returning-for-3_35",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "runtime-tokio",
] }
# sqlx: TLS via aws-lc-rs; runtime-tokio for async.  This is the sole TLS entry
# point for the DB stack -- sea-orm/sea-orm-migration intentionally use runtime-tokio
# (not runtime-tokio-rustls) to avoid pulling in ring.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs"] }

xxhash-rust = { version = "0.8", features = ["xxh3"] }

# File rotation for logging
file-rotate = "0.8"

# Time handling
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Kubernetes client (optional, for k8s feature gate)
kube = { version = "3.0", default-features = false }
k8s-openapi = { version = "0.27", default-features = false }

# DSN parsing
dsn = "1.1.1"
humantime = "2.3.0"

# URL parsing
url = "2.5"
urlencoding = "2.1"
# RFC 3986 percent-encoding. Already in the tree via `toolkit-contract`,
# which uses it to build path segments; promoted to a workspace dep so
# gears encoding provider-chosen identifiers into URLs share one version.
percent-encoding = "2"

# Regex for env expansion
regex = "1.10"

# CLI and terminal output
glob = "0.3"
supports-color = "3"
enable-ansi-support = "0.3"

# gRPC support
tonic = { version = "0.14", features = ["transport"] }
prost = { version = "0.14" }
tonic-prost = "0.14"

# Protocol buffer compilation (build dependencies)
tonic-prost-build = "0.14"

# Blocking HTTP client (for build scripts)
ureq = "3.3"

# Time handling
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }

# Cryptographic utilities
sha2 = "0.10"
hex = "0.4"

# JWT and authentication
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# Configuration management
figment = { version = "0.10", features = ["yaml", "env"] }
inventory = "0.3"

# File system utilities
tempfile = "3"
dirs = "6"

# Decimal handling
bigdecimal = "0.4"
rust_decimal = { version = "1.39", features = ["serde"] }
ryu = "1.0"

# System information
sysinfo = "0.38"
hostname = "0.4"
starship-battery = "0.11"
local-ip-address = "0.6"
machine-uid = "0.6"
nvml-wrapper = "0.12"

# Public Suffix List
psl = "2"

# Image processing (thumbnail generation)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Text processing
base64 = "0.22"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
strsim = "0.11"

# OData parsing
peg = "0.8"
chrono-tz = "0.10"

# Procedural macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = [
    "full",
    "parsing",
    "printing",
    "derive",
    "extra-traits",
] }
heck = "0.5"
proc-macro-crate = "3"

# Testing utilities
# Internal, unpublished: the single place every database container tag is
# pinned (see libs/test-containers). Lives here rather than with the other
# `libs/**` entries because it is only ever a dev-dependency, alongside the
# `testcontainers` pair it wraps.
test-containers = { package = "cf-gears-test-containers", path = "libs/test-containers" }
trybuild = "1"
serial_test = { version = "3", features = ["file_locks"] }
criterion = { version = "0.8", default-features = false }
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["aws-lc-rs", "postgres", "mysql"] }
httpmock = "0.8"
flate2 = "1"

# Async utilities
futures-core = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"

# HTTP types and web utilities
http = "1.3"
httpdate = "1"
matchit = "0.9"

# Document and file handling
rust-embed = "8"
bytes = "1.11"
mime = "0.3"

# Document parsing libraries
docx-rust = "0.1.11"
# `bundled-pdfium` downloads a prebuilt libpdfium at build time rather than vendoring one;
# Cargo.lock does not pin it. The version lives in .cargo/config.toml as PDFIUM_VERSION.
kreuzberg = { version = "=4.9.8", features = ["html", "excel", "office", "pdf", "bundled-pdfium"] }
# Content-based file type detection (ONNX model, embedded weights). Used
# only by file-parser's optional `magika` feature.
magika = "1.1"
# Pinned to match magika 1.1's own `ort` dependency exactly (`=2.0.0-rc.12`).
# `load-dynamic` is added on top of magika's own feature set (`ndarray`, `std`) so the
# ONNX Runtime shared library is resolved via `dlopen` at process start (`ORT_DYLIB_PATH`)
# instead of being statically linked at build time — the gear's build environment never
# needs the ONNX Runtime dev headers, only wherever the `magika`-enabled binary runs.
# `download-binaries` (which would fetch a prebuilt runtime over the network during
# `cargo build`) stays off; magika's own manifest already builds with default features off.
# `api-24` is required to compile this rc — without it, `ort`'s own `ep/vitis.rs` (compiled
# unconditionally, not feature-gated) references an `OrtApi` struct field that only exists
# at the api-24 ABI level; this is unrelated to which execution providers we actually use.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }

# Additional testing utilities
tokio-test = "0.4"
mockall = "0.13"
temp-env = { version = "0.3", features = ["async_closure"] }
wiremock = "0.6"

# Additional utilities
nanoid = "0.4"
fnv = "1.0"

# GTS dependencies
jsonschema = { version = "0.40", default-features = false }
walkdir = "2.5"

# GTS library — published on crates.io.
gts-id = "0.12.0"
gts = "0.12.0"
gts-macros = "0.12.0"

[workspace.metadata.cargo-shear]
ignored-paths = ["**/tests/ui/**", "**/tests/trybuild/**"]
# Gear crate deps only consumed by macro-generated re-exports in #[toolkit::gear(deps = [...])].
# cargo-shear cannot trace usage through proc-macro expansion, so these appear unused.
ignored = [
    "account-management",
    "authn-resolver",
    "authz-resolver",
    "credstore",
    "grpc_hub",
    "oagw",
    "resource-group",
    "tenant-resolver",
    "types-registry",
]

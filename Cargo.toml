toolkit-odata = { package = "cf-gears-toolkit-odata", version = "0.9.4", path = "libs/toolkit-odata" }
toolkit-odata-macros = { package = "cf-gears-toolkit-odata-macros", version = "0.6.12", path = "libs/toolkit-odata-macros" }

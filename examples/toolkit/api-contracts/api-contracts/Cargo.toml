[package]
name = "cf-api-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "api-contracts example module — PaymentApi with local and HTTP transport"
rust-version.workspace = true
publish = false

[features]
default = []
# OpenTelemetry in generated clients: W3C traceparent propagation + RED metrics.
otel = ["api-contracts-sdk/otel"]
grpc-client = [
    "api-contracts-sdk/grpc-client",
    "toolkit-contract/grpc-client",
    "dep:tonic",
    "dep:toolkit-transport-grpc",
]
# OoP binary (api-contracts-oop): bootstrap + embedded authn stack.
oop_module = [
    "dep:tokio",
    "dep:clap",
    "dep:mimalloc",
    "toolkit/bootstrap",
    "dep:authn-resolver",
    "dep:static-authn-plugin",
    "dep:types-registry",
]
# Kubernetes TokenReview platform-plane auth.
k8s-auth = ["toolkit/k8s-auth"]

[lints]
workspace = true

[[bin]]
name = "api-contracts-oop"
path = "src/main.rs"
required-features = ["oop_module"]

[dependencies]
# rest-server to serve the contract; rest-client for the resolving client
# used in tests.
api-contracts-sdk = { workspace = true, features = ["rest-client", "rest-server"] }
toolkit-contract = { workspace = true, features = ["runtime-client", "rest-server"] }
toolkit.workspace = true
toolkit-macros.workspace = true
toolkit-canonical-errors.workspace = true
toolkit-security.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
uuid.workspace = true
anyhow.workspace = true
futures-core.workspace = true
futures-util.workspace = true
async-stream = "0.3"
axum.workspace = true
http.workspace = true

tonic = { workspace = true, features = ["transport"], optional = true }
toolkit-transport-grpc = { workspace = true, optional = true }

# OoP-only, gated behind `oop_module`.
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
authn-resolver = { package = "cf-gears-authn-resolver", path = "../../../../gears/system/authn-resolver/authn-resolver", optional = true }
static-authn-plugin = { package = "cf-gears-static-authn-plugin", path = "../../../../gears/system/authn-resolver/plugins/static-authn-plugin", optional = true }
types-registry = { package = "cf-gears-types-registry", path = "../../../../gears/system/types-registry/types-registry", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toolkit-http.workspace = true
toolkit-canonical-errors.workspace = true
secrecy.workspace = true
mockall.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
